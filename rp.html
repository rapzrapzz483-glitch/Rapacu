<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Do You Love Me?</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%;
    background: #0a0a0a;
    overflow: hidden;
    font-family: 'Courier New', Courier, monospace;
  }

  /* ---------- SCREEN 1: DIALOG ---------- */
  #dialog-screen {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #0a0a0a;
  }

  .window {
    width: 380px;
    border: 2px solid #eee;
    box-shadow: 8px 8px 0px rgba(255,255,255,0.15);
    background: #0a0a0a;
    position: relative;
  }

  .titlebar {
    border-bottom: 2px solid #eee;
    padding: 6px 8px;
    display: flex;
    gap: 6px;
  }
  .dot {
    width: 10px; height: 10px;
    border: 1px solid #eee;
    border-radius: 50%;
    display: inline-block;
  }

  .content {
    padding: 40px 24px;
    text-align: center;
  }

  .question {
    color: #f2f2f2;
    font-size: 26px;
    letter-spacing: 1px;
    margin-bottom: 36px;
    text-shadow: 0 0 6px rgba(255,255,255,0.4);
  }

  .btn-row {
    position: relative;
    height: 50px;
  }

  button {
    font-family: inherit;
    font-size: 16px;
    letter-spacing: 1px;
    padding: 10px 26px;
    background: transparent;
    color: #f2f2f2;
    border: 2px solid #eee;
    cursor: pointer;
    transition: background 0.15s, color 0.15s;
  }

  #yesBtn {
    position: absolute;
    left: 50%;
    top: 0;
    transform: translateX(calc(-100% - 10px));
  }
  #yesBtn:hover {
    background: #f2f2f2;
    color: #0a0a0a;
  }

  #noBtn {
    position: absolute;
    left: 50%;
    top: 0;
    transform: translateX(10px);
  }

  /* ---------- SCREEN 2: LOVE YOU ---------- */
  #love-screen {
    position: fixed;
    inset: 0;
    display: none;
    background: #000;
    overflow: hidden;
  }

  #love-screen.active {
    display: block;
  }

  canvas#matrix {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
  }

  .center-stage {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    text-align: center;
    z-index: 5;
  }

  .heart {
    font-size: 140px;
    color: #fff;
    text-shadow:
      0 0 20px #ff2fb0,
      0 0 40px #ff2fb0,
      0 0 80px #ff2fb0,
      0 0 120px #ff2fb0;
    animation: pulse 1.2s ease-in-out infinite;
  }

  .love-text {
    margin-top: 10px;
    font-size: 34px;
    letter-spacing: 6px;
    color: #ff2fb0;
    text-shadow:
      0 0 10px #ff2fb0,
      0 0 20px #ff2fb0,
      0 0 40px #ff2fb0;
    font-weight: bold;
  }

  @keyframes pulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.08); }
  }
</style>
</head>
<body>

  <!-- SCREEN 1 -->
  <div id="dialog-screen">
    <div class="window">
      <div class="titlebar">
        <span class="dot"></span><span class="dot"></span><span class="dot"></span>
      </div>
      <div class="content">
        <div class="question">Do you love me?</div>
        <div class="btn-row">
          <button id="yesBtn">Yes</button>
          <button id="noBtn">No</button>
        </div>
      </div>
    </div>
  </div>

  <!-- SCREEN 2 -->
  <div id="love-screen">
    <canvas id="matrix"></canvas>
    <div class="center-stage">
      <div class="heart">&#10084;</div>
      <div class="love-text">LOVE YOU</div>
    </div>
  </div>

<script>
  // ---------- Runaway "No" button ----------
  const noBtn = document.getElementById('noBtn');
  const dialogScreen = document.getElementById('dialog-screen');

  function moveNoButton() {
    const margin = 40;
    const maxX = window.innerWidth - noBtn.offsetWidth - margin;
    const maxY = window.innerHeight - noBtn.offsetHeight - margin;
    const newX = Math.random() * (maxX - margin) + margin;
    const newY = Math.random() * (maxY - margin) + margin;

    noBtn.style.position = 'fixed';
    noBtn.style.left = newX + 'px';
    noBtn.style.top = newY + 'px';
    noBtn.style.transform = 'none';
  }

  noBtn.addEventListener('mouseover', moveNoButton);
  noBtn.addEventListener('click', (e) => {
    // just in case it ever gets clicked, dodge instead of triggering
    e.preventDefault();
    moveNoButton();
  });
  noBtn.addEventListener('touchstart', (e) => {
    e.preventDefault();
    moveNoButton();
  });

  // ---------- Yes click -> transition ----------
  const yesBtn = document.getElementById('yesBtn');
  const loveScreen = document.getElementById('love-screen');

  yesBtn.addEventListener('click', () => {
    dialogScreen.style.display = 'none';
    loveScreen.classList.add('active');
    startMatrix();
  });

  // ---------- Matrix "YOU LOVE" rain background ----------
  function startMatrix() {
    const canvas = document.getElementById('matrix');
    const ctx = canvas.getContext('2d');

    function resize() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    resize();
    window.addEventListener('resize', resize);

    const word = 'YOULOVE';
    const fontSize = 18;
    const columns = Math.ceil(canvas.width / fontSize);
    const drops = new Array(columns).fill(0);

    function draw() {
      ctx.fillStyle = 'rgba(0, 0, 0, 0.08)';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.font = fontSize + 'px monospace';

      for (let i = 0; i < drops.length; i++) {
        const char = word[Math.floor(Math.random() * word.length)];
        const x = i * fontSize;
        const y = drops[i] * fontSize;

        ctx.fillStyle = Math.random() > 0.96 ? '#ffffff' : '#ff2fb0';
        ctx.fillText(char, x, y);

        if (y > canvas.height && Math.random() > 0.975) {
          drops[i] = 0;
        }
        drops[i]++;
      }
    }

    setInterval(draw, 60);
  }
</script>

</body>
</html>
